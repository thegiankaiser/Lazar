services:
  db:
    image: postgres:16
    container_name: lazar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: lazar
      POSTGRES_USER: lazar
      POSTGRES_PASSWORD: lazar_dev_password
    ports:
      - "5432:5432"
    volumes:
      - lazar_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lazar -d lazar"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  lazar_pgdata:
