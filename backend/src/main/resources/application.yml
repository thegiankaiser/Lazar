server:
  port: 8080
spring:
  application:
    name: lazar-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lazar}
    username: ${DB_USERNAME:lazar}
    password: ${DB_PASSWORD:lazar_dev_password}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    default-property-inclusion: non_null
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
lazar:
  jwt:
    secret: ${JWT_SECRET:}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  ai:
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:gemini-3.8-flash}
  usage:
    free-daily-limit: ${FREE_DAILY_LIMIT:10}
